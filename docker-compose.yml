version: '3.8'

services:
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: aeropulse_jupyter
    ports:
      - "8888:8888"
      - "4040:4040"  # Spark UI
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./scripts:/home/jovyan/work/scripts
      - ./data:/home/jovyan/work/data
      - ./dashboard:/home/jovyan/work/dashboard
      - ./requirements.txt:/home/jovyan/work/requirements.txt
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - JUPYTER_TOKEN=abc123
      - JUPYTER_PASSWORD=
    networks:
      - aeropulse_net

networks:
  aeropulse_net:
    driver: bridge